[project]
name = "llm-wiki"
version = "0.1.0"
description = "Local-first, self-maintaining knowledge base manager powered by a local llama.cpp cluster."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlite-vec>=0.1",
    "openai>=1.50",
    "outlines>=0.1",
    "markdown-it-py>=3.0",
    "python-frontmatter>=1.1",
    "networkx>=3.3",
    "pygit2>=1.16",
    "watchdog>=5.0",
    "fastmcp>=0.2",
    "typer>=0.12",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_wiki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true
